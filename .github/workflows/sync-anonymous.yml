# Trigger anonymous.4open.science to re-mirror this repo after every push to main.
#
# Mechanism: anonymous.4open.science holds a read-only mirror of this GitHub
# repo. Its /api/repo/<id>/refresh endpoint forces a re-pull. We authenticate
# with a Bearer API token (generated from the anonymous.4open.science profile
# page).
#
# One-time setup:
#   1. Log into https://anonymous.4open.science with GitHub.
#   2. Open your profile / account settings -> API tokens -> Generate new token.
#      Copy the token (shown once).
#   3. In GitHub: Settings -> Secrets and variables -> Actions -> New repository secret
#      Name:  ANONYMOUS_API_TOKEN
#      Value: <paste token>
#   4. (Optional) If your anonymous repo ID ever changes, update ANONYMOUS_REPO_ID.
#      Default is rcp-audit-artifact-B314.
#   5. Push to main. The Action triggers a refresh; the anonymous URL updates
#      within a few minutes.

name: Sync to anonymous.4open.science

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger anonymous.4open.science refresh
        env:
          ANONYMOUS_API_TOKEN: ${{ secrets.ANONYMOUS_API_TOKEN }}
          ANONYMOUS_REPO_ID: ${{ vars.ANONYMOUS_REPO_ID || 'rcp-audit-artifact-B314' }}
        run: |
          if [ -z "$ANONYMOUS_API_TOKEN" ]; then
            echo "::error::ANONYMOUS_API_TOKEN secret is not set."
            echo "Generate a token at https://anonymous.4open.science (profile -> API tokens),"
            echo "then add it as a repository secret named ANONYMOUS_API_TOKEN."
            exit 1
          fi
          echo "Triggering refresh for $ANONYMOUS_REPO_ID..."
          HTTP_CODE=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $ANONYMOUS_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://anonymous.4open.science/api/repo/$ANONYMOUS_REPO_ID/refresh")
          echo "HTTP response: $HTTP_CODE"
          cat /tmp/response.json
          echo ""
          case "$HTTP_CODE" in
            200) echo "Refresh triggered successfully." ;;
            401) echo "::error::Unauthorized — token invalid or expired. Regenerate at anonymous.4open.science profile."; exit 1 ;;
            403) echo "::error::Forbidden — token owner is not the repo owner/coauthor/admin."; exit 1 ;;
            404) echo "::error::Repo $ANONYMOUS_REPO_ID not found. Check ANONYMOUS_REPO_ID variable."; exit 1 ;;
            409) echo "::warning::Repository is in preparing/removing/expiring state; retry later."; exit 1 ;;
            *)   echo "::error::Unexpected HTTP $HTTP_CODE"; exit 1 ;;
          esac

      - name: Summary
        if: always()
        run: |
          echo "## Anonymous sync: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Public URL: https://anonymous.4open.science/r/${ANONYMOUS_REPO_ID}/README.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: anonymous.4open.science re-pulls from GitHub. Updates may take a few minutes to appear; hard-refresh the page to bypass cache." >> $GITHUB_STEP_SUMMARY
        env:
          ANONYMOUS_REPO_ID: ${{ vars.ANONYMOUS_REPO_ID || 'rcp-audit-artifact-B314' }}
